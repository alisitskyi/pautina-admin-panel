<script>
    var table;
    $(document).ready(function () {
        table = $('#bookingListTable').DataTable({
            "processing": true,
            "serverSide": true,
            "pageLength": 10,
            "bSort": false,
            "searching": false,
            "ajax": {
                "url": "/admin/booking/table?room_id=14",
                "type": "POST",
                "data": function (d) {
                    d._csrf = "a1RGdHdwZE1eBH42MzIBGBEGCTcREyB6CBAyERhCNj8aHXQORyRTOQ==";
                    d.dateFrom = $('input[name="date_from"]').val();
                    d.dateTo = $('input[name="date_to"]').val();
                    d.status = $('#select-status').val();
                    d.confirm = $("#conform-select").val();
                }
            },
            "columns": [
                {
                    "data": function (d) {
                        return '<a style="cursor: pointer" onclick="editBooking(' + d.id + ')">' + d.date + '</a>'
                    }
                },
                {
                    "data": function (d) {
                        return '<a style="cursor: pointer" onclick="editBooking(' + d.id + ')">' + d.time + '</a>'
                    }
                },
                {"data": "price"},
                {"data": "name"},
                {"data": "phone"},
                {
                    "data": function (d) {
                        if (d.game_status == 1)
                            return '<i class="fa fa-exclamation-triangle" style="color: green" aria-hidden="true"></i> Состоялась';
                        else if (d.game_status == 2)
                            return '<i class="fa fa-exclamation-triangle" style="color: rgb(255, 188, 0)" aria-hidden="true"></i> Будет играть';
                        else if (d.game_status == 0)
                            return '<i class="fa fa-exclamation-triangle" style="color: red" aria-hidden="true"></i> Не состоялась';
                        else
                            return '<i class="fa fa-exclamation-triangle" style="color: grey" aria-hidden="true"></i> Сервисная бронь'
                    }
                },
                {
                    "data": function (d) {
                        if (d.client_confirm == 1)
                            return '<i class="fa fa-check fa-2x" style="color: green" aria-hidden="true"></i>';
                        else
                            return '<i class="fa fa-exclamation-triangle fa-2x" style="color: rgb(255, 188, 0)" aria-hidden="true"></i>';
                    }
                },
                {"data": "booking_time"}
            ],
            "fnRowCallback": function (nRow, aData) {
                if (aData.deleted == 1) {
                    $(nRow).css('color', 'red');
                }
            },
            "fnInitComplete": function (data) {
                var conflicts = data.jqXHR.responseJSON.conflicts;
                if (data.jqXHR.responseJSON.real !== 'access_denied')
                    $('#total_real').html('Сумма фактической стоимости: ' + data.jqXHR.responseJSON.real);
                if (conflicts != 0) {
                    var btn = $("#conf-btn");
                    btn.text('Конфликтные брони (' + conflicts + ')');
                    btn.show();
                }
            }

        });
        $("#conf-btn").click(function () {
            $("#select-status option[value=5]").attr('selected', 'selected');
            Filter();
        });
    });
    function Filter() {
        $("#conf-btn").hide();
        table.ajax.reload(function (json) {
            var conflicts = json.conflicts;
            if (conflicts != 0) {
                var btn = $("#conf-btn");
                btn.text('Конфликтные брони (' + conflicts + ')');
                btn.show();
            }
        });
    }

    function getFromData() {
        var _dateFrom = $('input[name="date_from"]').val();
        var _dateTo = $('input[name="date_to"]').val();
        var _status = $('#select-status').val();
        var _confirm = $("#conform-select").val();
        console.log(status);
        return {date_from: _dateFrom, date_to: _dateTo, status: _status, confirm: _confirm};
    }
    function editBooking(bookingID) {
        $.post('/admin/booking/editinfo', {
            _csrf: 'a1RGdHdwZE1eBH42MzIBGBEGCTcREyB6CBAyERhCNj8aHXQORyRTOQ==',
            id: bookingID
        }, function (htm) {
            $("#BMD .modal-body").html(htm);
            $("#BMD").modal('show');
        })
    }
</script>

            var inp = null;

            function loadFiles(inputid, fillImg,dir) {
                inp = inputid;
                fill = fillImg;
                var url = "/admin/default/files";
                if (dir)
                    url = url+'?dir='+dir;
                $.post(url, {_csrf: "a1RGdHdwZE1eBH42MzIBGBEGCTcREyB6CBAyERhCNj8aHXQORyRTOQ=="})
                        .done(function (data) {
                            // download images to modal window
                            images = JSON.parse(data);
                            $("#myModalBox #modalContent").children().remove();
                            for (var i = 0; i < images.length; i++) {
                                $("#modalContent").append("<img src='/" + images[i] + "' width='100' height='100'\n\
             onclick='fileSelect(\"" + images[i] + "\", \"" + inputid + "\", \"" + fillImg + "\")' class='imgmanager'>");
                            }
                        });
                $("#myModalBox").modal('show');
            }
            function fileSelect(path, inputid, fillImg) {
                $("#" + inputid).val('/' + path);
                $("#myModalBox").modal('hide');
                $('#myModalBox .imgmanager').remove();
                $("#" + fillImg).attr('src', "/" + path);
                if ($('#photo-gallery')) {
                    resetJcrop();
                }

            }
